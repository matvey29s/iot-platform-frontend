# Nexus IoT Platform - shared config of nexusd (daemon) and nexus-backend.
conf_version=4
# After editing:  /etc/init.d/nexusd restart; /etc/init.d/nexus-backend restart

# ---- backend (web UI + API) ----
listen=0.0.0.0:8080
www=/opt/nexus-iot/www
data=/opt/nexus-iot/data
socket=/var/run/nexus/daemon.sock

# ---- ADC: IIO sysfs files for the two module slots ----
# slot 1 = ADC channel 0, slot 2 = ADC channel 1
adc0=/sys/bus/iio/devices/iio:device0/in_voltage0_raw
adc1=/sys/bus/iio/devices/iio:device0/in_voltage1_raw
# no IIO driver in the kernel? the daemon then reads the AM335x ADC directly (/dev/mem).
# adc_mode: auto | iio | direct;  adc_ain0/1 = analog input AINx of slot 1 / slot 2
adc_mode=auto
adc_ain0=0
adc_ain1=1
# no ADC available? force the module type for testing: rs485 | relay | none  (remove the line to measure)
#slot1_force=rs485
#slot2_force=relay
adc_max=4095            # AM335x ADC is 12-bit

# ---- module detection (percent of adc_max) ----
rs485_percent=16.4      # ~16.4 % -> RS-485 module (pins = UART)
relay_percent=91.6      # ~91.6 % -> relay module  (pins = GPIO)
tolerance=5             # +-5 percentage points around each level
period=3                # seconds between measurements
confirm=2               # same result N times in a row before pins are switched

# ---- SLOTS = physical connectors. Their pins are fixed by the board, the MODULE TYPE is measured by the ADC ----
# Modules can be put into either slot: every 3 s the ADC says what stands in each slot (16.4 % = RS-485, 91.6 % = relay),
# the hook then routes THAT slot's pads (UART or GPIO) and nexusd opens the matching lines. Keys below belong to a slot.
#   slot1: UART1 = /dev/ttyO1 (UART1_TXD/RXD), DE=GPIO_115, /RE=GPIO_117, relay line = UART1_TXD pad = GPIO0_15
#   slot2: UART2 = /dev/ttyO2 (UART2_TXD = P9_21 / UART2_RXD = P9_22), DE=GPIO_48, /RE=GPIO_60, relay line = UART2_TXD pad = GPIO0_3
# serial device names of the omap-serial driver (ttyO*); on kernels with the 8250 OMAP driver use ttyS*
slot1_uart=/dev/ttyO1
slot2_uart=/dev/ttyO2

# ---- programmable buttons / LEDs (the first button = reset and the first LED = power are not used) ----
btn_gpio=66,69,45       # button 1..3
btn_active_low=0        # 0: buttons are pulled to ground, a HIGH level = pressed (no software debounce)
led_gpio=49,112,20      # LED 1..3
led_active_low=0        # 1: LED lights when the pin is low

# ---- relay module (ONE channel per slot = the slot's UART TX pad switched to GPIO) ----
slot1_tx_gpio=15        # GPIO0_15 = UART1_TXD (P9_24)
slot2_tx_gpio=3         # GPIO0_3 = UART2_TXD (P9_21)
relay_active_low=0      # 1: relay is ON when the pin is low

# ---- RS-485 module: driver-enable (DE) and receiver-enable (/RE) lines of each slot ----
# idle = both low (receive); while transmitting both are driven high
slot1_de=115
slot1_re=117
slot2_de=48
slot2_re=60
# 0: bytes that come back while sending (echo, TX/RX shorted) appear as rx in the terminal; 1: they are dropped
rs485_drop_echo=0

# ---- hook that switches the pins (pin map of both slots is inside) ----
hook=/etc/nexus/hooks/module-hook.sh

# ---- what the backend watches for the Device tab ----
eth1=eth0              # interface shown as "ethernet1" on the Device tab
eth2=eth1
disk_path=/

# RS-485: 0 = bytes that come back while sending (echo / loopback) are shown as rx in the terminal; 1 = dropped
rs485_drop_echo=0
