# Nexus IoT Platform - shared config of nexusd (daemon) and nexus-backend.
# After editing:  /etc/init.d/nexusd restart; /etc/init.d/nexus-backend restart

# ---- backend (web UI + API) ----
listen=0.0.0.0:8080
www=/opt/nexus-iot/www
data=/opt/nexus-iot/data
socket=/var/run/nexus/daemon.sock

# ---- ADC: IIO sysfs files for the two module slots ----
# slot 1 = ADC channel 0, slot 2 = ADC channel 1
adc0=/sys/bus/iio/devices/iio:device0/in_voltage0_raw
adc1=/sys/bus/iio/devices/iio:device0/in_voltage1_raw
adc_max=4095            # AM335x ADC is 12-bit

# ---- module detection (percent of adc_max) ----
rs485_percent=16.4      # ~16.4 % -> RS-485 module (pins = UART)
relay_percent=91.6      # ~91.6 % -> relay module  (pins = GPIO)
tolerance=5             # +-5 percentage points around each level
period=3                # seconds between measurements
confirm=2               # same result N times in a row before pins are switched

# ---- UART device of each slot (used when an RS-485 module is detected) ----
uart_dev1=/dev/ttyS1
uart_dev2=/dev/ttyS4   # UART4 (must be enabled in the device tree)

# ---- programmable buttons / LEDs (the first button = reset and the first LED = power are not used) ----
btn_gpio=66,69,45       # button 1..3
btn_active_low=1        # 1: pressed = low level (pull-up wiring)
led_gpio=49,112,20      # LED 1..3
led_active_low=0        # 1: LED lights when the pin is low

# ---- relay module: GPIO of channels 1..4 per slot ----
relay1_gpios=115,117,15,14
relay2_gpios=48,60,31,30
relay_active_low=0      # 1: relay is ON when the pin is low

# ---- RS-485 module: driver-enable (DE) and receiver-enable (/RE) lines per slot ----
# idle = both low (receive); while transmitting both are driven high
rs485_de1=115
rs485_re1=117
rs485_de2=48
rs485_re2=60

# ---- hook that switches the pins (pin map of both slots is inside) ----
hook=/etc/nexus/hooks/module-hook.sh

# ---- what the backend watches for the Device tab ----
eth1=eth0
eth2=eth1
disk_path=/
